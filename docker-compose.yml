services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mor_ledger
      POSTGRES_USER: mor
      POSTGRES_PASSWORD: mor
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mor -d mor_ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
