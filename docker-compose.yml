services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mor_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-mor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mor}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432" # for psql/IDE access only; the app uses the compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    security_opt: ["seccomp=unconfined"] # the TigerBeetle client (LEDGER_ENGINE=TIGERBEETLE) uses io_uring too
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mor_ledger}
      DB_USER: ${POSTGRES_USER:-mor}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mor}
      MOR_FEE_RATE: ${MOR_FEE_RATE:-0.05}
      REFUND_FEE_POLICY: ${REFUND_FEE_POLICY:-MOR_KEEPS_FEE}
      BALANCE_MODE: ${BALANCE_MODE:-STORED}
      HOT_ACCOUNT_SHARDS: ${HOT_ACCOUNT_SHARDS:-1}
      BALANCE_REFRESH_MS: ${BALANCE_REFRESH_MS:-1000}
      LEDGER_ENGINE: ${LEDGER_ENGINE:-POSTGRES}
      TB_ADDRESS: tigerbeetle:3000
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_started
        required: false # only with the "tb" profile

  tigerbeetle:
    profiles: [tb]
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    security_opt: ["seccomp=unconfined"] # TigerBeetle needs io_uring, which Docker 25+ blocks by default
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /data/0_0.tigerbeetle ] || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle;
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --cache-grid=256MiB /data/0_0.tigerbeetle
    volumes:
      - tbdata:/data

  postgres-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mor_ledger_test
      POSTGRES_USER: mor
      POSTGRES_PASSWORD: mor
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mor -d mor_ledger_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    profiles: [test]
    build:
      context: .
      target: build
    security_opt: ["seccomp=unconfined"] # the TigerBeetle client uses io_uring
    command: ["gradle", "--no-daemon", "test", "--rerun", "integrationTest", "--rerun"] # always execute, never reuse cached results
    environment:
      TEST_DB_URL: jdbc:postgresql://postgres-test:5432/mor_ledger_test
      TEST_DB_USER: mor
      TEST_DB_PASSWORD: mor
      TB_ADDRESS: tigerbeetle-test:3000
    volumes:
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      postgres-test:
        condition: service_healthy
      tigerbeetle-test:
        condition: service_started

  tigerbeetle-test:
    profiles: [test]
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle &&
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    tmpfs:
      - /data

  k6:
    profiles: [tools]
    image: grafana/k6:2.3.0
    working_dir: /scripts # so scripts are run by name (`k6 run seed.js`), the same in every shell
    environment:
      BASE_URL: http://app:8090
    volumes:
      - ./perf/k6:/scripts:ro
      - ./perf/results:/results
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  tbdata:
  gradle-cache:
