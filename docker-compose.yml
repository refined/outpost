# Everything runs in Docker; the host needs nothing but Docker.
# Settings come from .env (optional; see .env.example). Without it, the defaults below apply.
#
#   docker compose up -d --build --wait            # Postgres + service -> http://localhost:8090/ui/
#   docker compose --profile test run --rm test    # full test suite in a JDK container, against its own Postgres
#   docker compose --profile test down             # stop everything, incl. the test database (-v also drops data)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mor_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-mor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mor}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432" # for psql/IDE access only; the app uses the compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mor_ledger}
      DB_USER: ${POSTGRES_USER:-mor}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mor}
      MOR_FEE_RATE: ${MOR_FEE_RATE:-0.05}
      REFUND_FEE_POLICY: ${REFUND_FEE_POLICY:-MOR_KEEPS_FEE}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Tests (profile "test"): the build stage of the Dockerfile runs Gradle against a throwaway database. ──────
  postgres-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mor_ledger_test
      POSTGRES_USER: mor
      POSTGRES_PASSWORD: mor
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mor -d mor_ledger_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    profiles: [test]
    build:
      context: .
      target: build
    command: ["gradle", "--no-daemon", "test", "--rerun"] # always execute, never reuse cached results
    environment:
      TEST_DB_URL: jdbc:postgresql://postgres-test:5432/mor_ledger_test
      TEST_DB_USER: mor
      TEST_DB_PASSWORD: mor
    volumes:
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  pgdata:
  gradle-cache:
