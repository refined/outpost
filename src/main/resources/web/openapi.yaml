openapi: 3.0.3
info:
  title: Mini MoR Ledger Service
  version: 0.1.0
  description: |
    Records captured payments and refunds for a Merchant of Record and reports what the MoR owes tax authorities and merchants.

    * Money is an integer number of **minor units** (cents) plus an ISO 4217 currency.
    * Rates are decimal strings: `"0.21"` means 21%.
    * `paymentId` / `refundId` are the external event ids and the idempotency keys: re-sending the same request returns
      the stored result with `200`; re-using an id with a different payload returns `409 idempotency_conflict`.
    * Every error has the shape `{"error": "<stable code>", "message": "<text>"}`.
servers:
  - url: /
tags:
  - name: Payments
  - name: Reports
  - name: Analytics
    description: Read-only aggregates for the demo console (totals, time series, per-merchant breakdown).
  - name: Ops

paths:
  /v1/payments:
    get:
      tags: [Payments]
      summary: List payments (latest capture first), filtered and paged
      parameters:
        - { name: merchantId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [CAPTURED, PARTIALLY_REFUNDED, REFUNDED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
                  total: { type: integer, format: int64, description: Number of payments matching the filters }
    post:
      tags: [Payments]
      summary: Capture a payment
      description: |
        Records that a customer payment was captured for a merchant (typically forwarded from a PSP webhook).
        `amount` is the gross the customer paid, **tax included**. The service extracts the tax, takes the MoR fee
        (a % of gross from config) and credits the remainder to the merchant, in one balanced journal entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureRequest' }
            example:
              paymentId: pay_1001
              merchantId: acme
              amount: 12100
              currency: EUR
              taxRate: "0.21"
              taxJurisdiction: NL
              capturedAt: "2026-10-14T10:00:00Z"
      responses:
        '201': { description: Captured, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '200': { description: Replay of an already recorded capture, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get a payment with its refunds
      parameters: [ { $ref: '#/components/parameters/PaymentId' } ]
      responses:
        '200': { description: The payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/payments/{paymentId}/refunds:
    post:
      tags: [Payments]
      summary: Refund a captured payment (full or partial)
      description: |
        Omit `amount` to refund everything that is still refundable. A partial refund is split across tax, fee and
        merchant in proportion to what remains of each (largest remainder), so a series of refunds always adds up
        exactly. Whether the MoR fee is returned depends on the payment's `refundFeePolicy`, fixed at capture.
      parameters: [ { $ref: '#/components/parameters/PaymentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
            example: { refundId: ref_1001_a, amount: 6050 }
      responses:
        '201': { description: Refunded, content: { application/json: { schema: { $ref: '#/components/schemas/RefundResponse' } } } }
        '200': { description: Replay of an already recorded refund, content: { application/json: { schema: { $ref: '#/components/schemas/RefundResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/reports/balances:
    get:
      tags: [Reports]
      summary: What the MoR owes tax authorities and merchants
      description: Without `asOf`, reads each account's stored running balance. With `asOf`, sums the postings of entries whose event time (capturedAt / refundedAt) is at or before it.
      parameters:
        - { name: asOf, in: query, required: false, schema: { type: string, format: date-time }, example: "2026-10-14T23:59:59Z" }
        - { name: currency, in: query, required: false, schema: { type: string }, example: EUR }
      responses:
        '200': { description: Balances, content: { application/json: { schema: { $ref: '#/components/schemas/Balances' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/journal:
    get:
      tags: [Reports]
      summary: Journal entries with their debit and credit lines (most recent first)
      parameters:
        - { name: paymentId, in: query, required: false, schema: { type: string } }
        - { name: merchantId, in: query, required: false, schema: { type: string }, description: Entries that touch the merchant's account }
        - { name: before, in: query, required: false, schema: { type: integer, format: int64 }, description: Keyset paging - entries with a smaller id }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Entries, content: { application/json: { schema: { $ref: '#/components/schemas/Journal' } } } }

  /v1/ledger/accounts:
    get:
      tags: [Reports]
      summary: Every ledger account with its current balance (hot-account shards listed separately)
      parameters:
        - { name: currency, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Accounts, content: { application/json: { schema: { type: object } } } }

  /v1/ledger/verify:
    get:
      tags: [Reports]
      summary: Reconciliation - accounts whose stored balance differs from the sum of their postings
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, mismatches: { type: array, items: { type: object } } } } } } }

  /v1/ledger/lag:
    get:
      tags: [Reports]
      summary: How far the balance snapshot is behind (BALANCE_MODE=SNAPSHOT / BATCHED; zeros otherwise)
      description: >
        `pendingEntries` wait for the next snapshot refresh. `readLagMs` is how stale a current-balance read can be:
        the age of the oldest pending entry in BATCHED mode, 0 when reads are exact.
      responses:
        '200':
          description: Lag
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingEntries: { type: integer, format: int64 }
                  oldestPendingAgeMs: { type: integer, format: int64 }
                  readLagMs: { type: integer, format: int64 }
                  refreshedAt: { type: string, format: date-time, nullable: true }

  /v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Totals per currency, by tax jurisdiction
      description: Captured and refunded money split into tax, MoR fee and merchant share. `from`/`to` filter on event time.
      parameters:
        - { name: currency, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Summary, content: { application/json: { schema: { type: object } } } }

  /v1/analytics/timeseries:
    get:
      tags: [Analytics]
      summary: Captured vs refunded per day / week / month, with the running merchant balance
      parameters:
        - { name: currency, in: query, required: true, schema: { type: string }, example: EUR }
        - { name: merchantId, in: query, required: false, schema: { type: string } }
        - { name: bucket, in: query, required: false, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Points, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/analytics/merchants:
    get:
      tags: [Analytics]
      summary: Per-merchant breakdown, reconciled against the ledger
      description: One row per merchant and currency. `reconciled` is true when the balance from the business records equals the merchant's ledger balance.
      parameters:
        - { name: currency, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string }, description: Merchant id contains }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [gross, payments, refundRate, refunded, fee, balance, lastPayment, merchant], default: gross } }
        - { name: order, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Merchants, content: { application/json: { schema: { type: object } } } }

  /v1/analytics/merchants/{merchantId}:
    get:
      tags: [Analytics]
      summary: One merchant per currency, by jurisdiction
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Merchant, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [Ops]
      summary: Liveness and database check
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok }, ledger: { type: string, example: "postgres (balances: stored)" } } } } } }

components:
  parameters:
    PaymentId: { name: paymentId, in: path, required: true, schema: { type: string }, example: pay_1001 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'

    CaptureRequest:
      type: object
      additionalProperties: false
      required: [paymentId, merchantId, amount, currency, taxRate, taxJurisdiction]
      properties:
        paymentId: { $ref: '#/components/schemas/Id' }
        merchantId: { $ref: '#/components/schemas/Id' }
        amount: { type: integer, format: int64, minimum: 1, description: Gross paid by the customer, tax included, in minor units }
        currency: { type: string, example: EUR, description: ISO 4217 }
        taxRate: { type: string, example: "0.21", description: 'Fraction in [0, 1), up to 6 decimals' }
        taxJurisdiction: { type: string, example: NL, pattern: '^[A-Z]{2}(-[A-Z0-9]{1,3})?$', description: 'ISO 3166-1 alpha-2, optionally with a subdivision (US-CA)' }
        capturedAt: { type: string, format: date-time, description: Event time; defaults to now; must not be in the future }

    RefundRequest:
      type: object
      additionalProperties: false
      required: [refundId]
      properties:
        refundId: { $ref: '#/components/schemas/Id' }
        amount: { type: integer, format: int64, minimum: 1, description: Omit for a full refund of what remains }
        refundedAt: { type: string, format: date-time, description: Event time; defaults to now; not before capturedAt }

    Parts:
      type: object
      properties:
        amount: { type: integer, format: int64 }
        taxAmount: { type: integer, format: int64 }
        feeAmount: { type: integer, format: int64 }
        merchantAmount: { type: integer, format: int64 }

    Refund:
      type: object
      properties:
        refundId: { type: string }
        paymentId: { type: string }
        amount: { type: integer, format: int64 }
        taxAmount: { type: integer, format: int64 }
        feeAmount: { type: integer, format: int64 }
        merchantAmount: { type: integer, format: int64 }
        refundedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        paymentId: { type: string }
        merchantId: { type: string }
        currency: { type: string }
        status: { type: string, enum: [CAPTURED, PARTIALLY_REFUNDED, REFUNDED] }
        amount: { type: integer, format: int64 }
        taxAmount: { type: integer, format: int64 }
        feeAmount: { type: integer, format: int64 }
        merchantAmount: { type: integer, format: int64 }
        taxRate: { type: string }
        taxJurisdiction: { type: string }
        feeRate: { type: string }
        refundFeePolicy: { type: string, enum: [MOR_KEEPS_FEE, MOR_RETURNS_FEE] }
        capturedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        refunded: { $ref: '#/components/schemas/Parts' }
        refundable: { $ref: '#/components/schemas/Parts' }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' } }

    RefundResponse:
      type: object
      properties:
        refund: { $ref: '#/components/schemas/Refund' }
        payment: { $ref: '#/components/schemas/Payment' }

    Balances:
      type: object
      properties:
        asOf: { type: string, format: date-time, nullable: true }
        taxAuthorities:
          type: array
          items:
            type: object
            properties:
              jurisdiction: { type: string }
              currency: { type: string }
              amountOwed: { type: integer, format: int64 }
        merchants:
          type: array
          items:
            type: object
            properties:
              merchantId: { type: string }
              currency: { type: string }
              balance: { type: integer, format: int64, description: What the MoR owes the merchant; negative when the merchant owes the MoR }
        mor:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              feeRevenue: { type: integer, format: int64 }
              pspClearing: { type: integer, format: int64, description: Collected from customers net of refunds }
        integrity:
          type: object
          properties:
            balanced: { type: boolean, description: Sum of all postings is zero in every currency }
            unbalancedCurrencies: { type: array, items: { type: string } }

    Journal:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              kind: { type: string, enum: [CAPTURE, REFUND] }
              paymentId: { type: string }
              refundId: { type: string, nullable: true }
              effectiveAt: { type: string, format: date-time }
              recordedAt: { type: string, format: date-time }
              postings:
                type: array
                items:
                  type: object
                  properties:
                    account: { type: string, example: 'merchant_payable:acme' }
                    currency: { type: string }
                    debit: { type: integer, format: int64, nullable: true }
                    credit: { type: integer, format: int64, nullable: true }

    Error:
      type: object
      properties:
        error:
          type: string
          enum: [invalid_request, payment_not_found, merchant_not_found, idempotency_conflict, refund_exceeds_refundable, payment_fully_refunded, refund_before_capture, amount_too_small, not_supported_by_ledger_engine, internal_error]
        message: { type: string }
