name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} · JDK ${{ matrix.java }} · ${{ matrix.db }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: the same path as local development — Testcontainers starts Postgres in Docker.
          - { os: ubuntu-latest, java: "17", db: testcontainers }
          - { os: ubuntu-latest, java: "25", db: testcontainers }
          # macOS/Windows runners have no Docker for Linux containers, so tests use a native Postgres.
          - { os: macos-latest, java: "17", db: native-postgres }
          - { os: windows-latest, java: "17", db: native-postgres }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Start native PostgreSQL
        if: matrix.db == 'native-postgres'
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: mor
          password: mor
          database: mor_ledger
          postgres-version: "17"

      - name: Point tests at the native PostgreSQL
        if: matrix.db == 'native-postgres'
        shell: bash
        run: |
          echo "TEST_DB_URL=jdbc:postgresql://localhost:5432/mor_ledger" >> "$GITHUB_ENV"
          echo "TEST_DB_USER=mor" >> "$GITHUB_ENV"
          echo "TEST_DB_PASSWORD=mor" >> "$GITHUB_ENV"

      - name: Build and test (gradlew)
        if: runner.os != 'Windows'
        working-directory: service
        run: ./gradlew build

      - name: Build and test (gradlew.bat)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: service
        run: gradlew.bat build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: service/build/reports/tests/

  # The Docker-only path from the README: no JDK on the host, everything via docker compose.
  docker:
    name: docker compose · image, smoke test, test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build the image and start Postgres + app
        run: docker compose up -d --build --wait

      - name: Smoke test through the API
        run: |
          curl -fsS localhost:8090/health
          curl -fsS -X POST localhost:8090/v1/payments -H 'Content-Type: application/json' \
            -d '{"paymentId":"pay_ci","merchantId":"acme","amount":12100,"currency":"EUR","taxRate":"0.21","taxJurisdiction":"NL"}'
          curl -fsS -X POST localhost:8090/v1/payments/pay_ci/refunds -H 'Content-Type: application/json' -d '{"refundId":"ref_ci"}'
          curl -fsS localhost:8090/v1/reports/balances | tee report.json
          grep -q '"balanced":true' report.json
          curl -fsS -o /dev/null localhost:8090/ui/

      - name: Test suite in Docker
        run: docker compose --profile test run --rm test

      - name: Container logs
        if: failure()
        run: docker compose logs
